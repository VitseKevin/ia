# TP 1 : configuration du chatbot RAG.
# Chunking par sections Markdown, 600 caractères, chevauchement 80 : voir la
# justification chiffrée dans le README (section « Justification du chunking »).
name: tp1
chunking: markdown        # "fixed" ou "markdown"
chunk_size: 600           # en caractères
chunk_overlap: 80
embedding_model: BAAI/bge-m3
top_k: 3
rerank: false
llm_provider: auto        # Ollama si disponible, sinon Gemini
ollama_model: qwen3:8b
gemini_model: gemini-3.1-flash-lite
temperature: 0.0
